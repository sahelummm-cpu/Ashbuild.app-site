<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Freed</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; justify-content: center; align-items: center; text-align: center; padding: 24px;">

  <div class="ambient-glow">
    <div class="glow-circle-1"></div>
  </div>

  <div class="container" style="max-width: 500px;">
    <img src="/assets/app-icon.png" alt="Freed Logo" style="width: 80px; height: 80px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 24px;">
    <h1 style="font-size: 54px; font-weight: 800; line-height: 1; margin-bottom: 16px;">404</h1>
    <h2 style="font-size: 24px; font-weight: 700; margin-bottom: 12px;">Page Not Found</h2>
    <p style="color: var(--text-secondary); margin-bottom: 32px;">The page you are looking for does not exist or has been moved.</p>
    <a href="/" class="btn btn-primary btn-lg">Return to Homepage</a>
  </div>

</html>
